[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paperjay"
dynamic = ["version"]
description = "Self-hosted document filing with mature OCR and cited answers to plain-language questions."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
keywords = ["documents", "ocr", "self-hosted", "paperless", "ollama", "rag"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "ocrmypdf>=17.0,<18",
    "pikepdf>=8",
    "img2pdf>=0.5",
    "pillow>=10.1",
    "pillow-heif>=0.18",
    "opencv-python-headless>=4.10",
    "cryptography>=42",
    "segno>=1.6",  # Phase D: QR codes on printed paper labels (pure Python, no other deps)
    "fastembed>=0.7,<1",  # 0.5: the built-in model for search by meaning (ONNX Runtime on the CPU, no PyTorch)
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
paperjay = "paperjay.__main__:main"

[tool.setuptools]
packages = ["paperjay", "paperjay.migrations"]

[tool.setuptools.dynamic]
version = { attr = "paperjay.__version__" }

[tool.setuptools.package-data]
"paperjay.migrations" = ["*.sql"]
paperjay = ["static/*", "static/js/*", "static/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
